name: 'Lorem Audit'
description: 'Run the production readiness audit and output a scored report'

inputs:
  env:
    description: 'Target environment (staging | production | dev)'
    required: false
    default: 'staging'

  repo:
    description: 'Path to the repository to audit (relative to workspace)'
    required: false
    default: '.'

  skip-quality:
    description: 'Skip Lighthouse quality checks'
    required: false
    default: 'false'

  skip-docker:
    description: 'Skip Docker build check'
    required: false
    default: 'false'

  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

outputs:
  score:
    description: 'Numeric audit score (0–100)'
    value: ${{ steps.run-audit.outputs.score }}

  status:
    description: 'Audit status string'
    value: ${{ steps.run-audit.outputs.status }}

  passed:
    description: 'Passed checks'
    value: ${{ steps.run-audit.outputs.passed }}

  failed:
    description: 'Failed checks'
    value: ${{ steps.run-audit.outputs.failed }}

runs:
  using: "composite"

  steps:
    # ─────────────────────────────
    # Node setup
    # ─────────────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # ─────────────────────────────
    # Install audit tool deps
    # ─────────────────────────────
    - name: Install audit tool dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ -f "package.json" ]; then
          npm install --legacy-peer-deps --no-audit --no-fund
        fi

    # ─────────────────────────────
    # Install repo deps safely
    # ─────────────────────────────
    - name: Install repo dependencies
      shell: bash
      working-directory: ${{ inputs.repo }}
      run: |
        if [ -f "package.json" ]; then
          npm install --legacy-peer-deps --no-audit --no-fund
        fi

    # ─────────────────────────────
    # Run audit (FIXED PATH)
    # ─────────────────────────────
    - name: Run Lorem Audit
      id: run-audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        AUDIT_ENV: ${{ inputs.env }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CI: 'true'
      run: |
        SKIP_QUALITY=""
        SKIP_DOCKER=""

        [[ "${{ inputs.skip-quality }}" == "true" ]] && SKIP_QUALITY="--skip-quality"
        [[ "${{ inputs.skip-docker }}" == "true" ]] && SKIP_DOCKER="--skip-docker"

        echo "Running audit from: ${{ github.action_path }}"

        node ${{ github.action_path }}/audit.js \
          --repo "${{ inputs.repo }}" \
          --env "${{ inputs.env }}" \
          $SKIP_QUALITY \
          $SKIP_DOCKER

    # ─────────────────────────────
    # Upload report
    # ─────────────────────────────
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-report-${{ inputs.env }}-${{ github.run_number }}
        path: |
          audit-report.json
          audit-report.md
        retention-days: 30