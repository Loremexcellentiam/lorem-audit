# nginx.conf — Hardened NGINX config for React SPA / Next.js static export
# Satisfies HDR-001: CSP, X-Frame-Options, HSTS, X-Content-Type-Options
#
# Place at: nginx.conf (repo root), copied into Docker image as /etc/nginx/conf.d/app.conf
# For VPS direct installs: copy to /etc/nginx/sites-available/your-app

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers (HDR-001) ───────────────────────────────────────────
    # Content-Security-Policy
    # Adjust sources to match your app's actual CDN/API domains.
    # IMPORTANT: tighten 'unsafe-inline' once you move to nonce-based CSP.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: https:; \
         connect-src 'self' https://api.example.com; \
         frame-src 'none'; \
         object-src 'none'; \
         base-uri 'self'; \
         form-action 'self';"
        always;

    # X-Frame-Options — prevents clickjacking
    add_header X-Frame-Options "DENY" always;

    # Strict-Transport-Security — HSTS (only effective over HTTPS)
    # Preload requires registration at https://hstspreload.org
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Content-Type-Options — prevents MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy (best practice, not in rubric but recommended)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy (best practice)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Hashed assets (JS/CSS bundles) — cache forever
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (NGINX doesn't inherit them in nested blocks)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images — cache 7 days
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    # Used by smoke-test.sh and Docker HEALTHCHECK
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── SPA fallback (React Router / Next.js static) ─────────────────────────
    # All unmatched paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    location ~* (\.env|\.git|wp-admin|xmlrpc\.php) {
        deny all;
        return 404;
    }
}
