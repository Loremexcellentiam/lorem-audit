name: 'Lorem Audit'
description: 'Run the production readiness audit and output a scored report'

inputs:
  env:
    description: 'Target environment (staging | production | dev)'
    required: false
    default: 'staging'

  repo:
    description: 'Path to the repository to audit (relative to workspace)'
    required: false
    default: '.'

  skip-quality:
    description: 'Skip Lighthouse quality checks (faster, use for draft PRs)'
    required: false
    default: 'false'

  skip-docker:
    description: 'Skip Docker build check'
    required: false
    default: 'false'

  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

outputs:
  score:
    description: 'Numeric audit score (0–100)'
    value: ${{ steps.run-audit.outputs.score }}

  status:
    description: 'Audit status string'
    value: ${{ steps.run-audit.outputs.status }}

  passed:
    description: 'Number of checks passed'
    value: ${{ steps.run-audit.outputs.passed }}

  failed:
    description: 'Number of checks failed'
    value: ${{ steps.run-audit.outputs.failed }}

runs:
  using: 'composite'

  steps:
    # ─────────────────────────────────────────────
    # Node setup (NO npm caching to avoid implicit installs)
    # ─────────────────────────────────────────────
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # ─────────────────────────────────────────────
    # Install audit tool (SAFE - NO CI, NO STRICT RESOLUTION)
    # ─────────────────────────────────────────────
    - name: Install lorem-audit tool dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ -f "package.json" ]; then
          echo "Installing audit tool dependencies (safe mode)"
          npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock
        fi

    # ─────────────────────────────────────────────
    # Install repo dependencies (SAFE MODE)
    # ─────────────────────────────────────────────
    - name: Install repo dependencies
      shell: bash
      working-directory: ${{ inputs.repo }}
      run: |
        if [ -f "package.json" ]; then
          echo "Installing repo dependencies (safe mode)"
          npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock
        fi

    # ─────────────────────────────────────────────
    # Run audit
    # ─────────────────────────────────────────────
    - name: Run Lorem Audit
      id: run-audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        AUDIT_ENV: ${{ inputs.env }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CI: 'true'
      run: |
        SKIP_QUALITY=""
        SKIP_DOCKER=""

        [[ "${{ inputs.skip-quality }}" == "true" ]] && SKIP_QUALITY="--skip-quality"
        [[ "${{ inputs.skip-docker }}" == "true" ]] && SKIP_DOCKER="--skip-docker"

        echo "Running audit in safe mode..."

        node ${{ github.action_path }}/../../../audit.js \
          --repo "${{ inputs.repo }}" \
          --env "${{ inputs.env }}" \
          $SKIP_QUALITY \
          $SKIP_DOCKER

    # ─────────────────────────────────────────────
    # Upload report
    # ─────────────────────────────────────────────
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-report-${{ inputs.env }}-${{ github.run_number }}
        path: |
          audit-report.json
          audit-report.md
        retention-days: 30